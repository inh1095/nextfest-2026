name: Collect and publish Next Fest

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

concurrency:
  group: nextfest-observations-and-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      archived: ${{ steps.collect.outputs.archived }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify collector
        run: python3 -m unittest discover -s tests -v
      - name: Collect public observations within the event window
        id: collect
        run: python3 scripts/collect.py
      - name: Validate public data
        run: python3 scripts/validate.py
      - name: Preserve observations in repository history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/config.json site/data/observations.json site/data/observations.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: update Next Fest observations"
            git push origin HEAD:main
          fi
      - name: Upload the static website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  publish:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  finalize:
    needs: [monitor, publish]
    if: needs.monitor.outputs.archived == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Disable scheduled workflow only after final publication succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/disable"
